<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found - Homebound</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/favicon-48.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #F6F1E6;
            --ink: #26221A;
            --pine: #24492A;
            --fern: #356B3D;
            --muted: #5c554a;
            --card: #FDFBF5;
            --display: 'Bricolage Grotesque', system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
            line-height: 1.5;
            color: var(--ink);
            background: var(--cream);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: var(--fern); }
        a:hover { color: var(--pine); }
        nav {
            padding: 14px 32px;
            border-bottom: 1px solid rgba(38, 34, 26, 0.08);
        }
        .nav-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--ink);
        }
        .nav-brand img { width: 30px; height: 30px; border-radius: 7px; }
        .nav-brand span {
            font-family: var(--display);
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 16px 80px;
        }
        .card {
            max-width: 480px;
            width: 100%;
            background: var(--card);
            border: 1.5px solid rgba(38, 34, 26, 0.09);
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
        }
        h1 {
            font-family: var(--display);
            font-size: 2rem;
            font-weight: 800;
            color: var(--pine);
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }
        p { color: var(--muted); margin-bottom: 24px; }
        .links { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .btn {
            display: inline-block;
            min-width: 220px;
            padding: 12px 22px;
            border-radius: 999px;
            font-weight: 600;
            text-decoration: none;
        }
        .btn-primary { background: var(--pine); color: var(--cream); }
        .btn-primary:hover { background: #1c3a21; color: var(--cream); }
        .btn-ghost { border: 1.5px solid rgba(36, 73, 42, 0.25); color: var(--pine); }
        .btn-ghost:hover { background: rgba(53, 107, 61, 0.06); }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="nav-brand">
            <img src="/assets/logo-64.png" alt="" width="30" height="30">
            <span>Homebound</span>
        </a>
    </nav>
    <main>
        <div class="card">
            <h1>This page isn't here.</h1>
            <p>The link may be old, or the page may have moved.</p>
            <div class="links">
                <a class="btn btn-primary" href="/">Go to the home page</a>
                <a class="btn btn-ghost" href="/help/">Visit the Help Center</a>
                <a class="btn btn-ghost" href="https://apps.apple.com/us/app/homebound-check-in/id6754800989">Get Homebound on the App Store</a>
            </div>
        </div>
    </main>
</body>
</html>
