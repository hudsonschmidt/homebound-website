name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Upload and deploy are separate jobs on purpose. In one job, deploy-pages asked for the
# "github-pages" artifact about a second after the upload finished, before GitHub's artifact
# list showed it, and failed with "No artifacts named github-pages were found" (3 of 4 runs,
# 2026-11-22/23; deploy-pages doesn't retry). The second job starts on a fresh runner seconds
# later, by which time the list has caught up. This is the layout of GitHub's own Pages
# starter workflows.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
