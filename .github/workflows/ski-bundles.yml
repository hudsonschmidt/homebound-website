name: Ski bundles

# Rebuilds Homebound's ski trail bundles from OpenSkiData and uploads them to the R2 bucket
# served at https://ski.homeboundapp.com. Method and format: skidata/README.md.
#
# Runs weekly and by hand only. There is deliberately no push or pull_request trigger:
# website pushes never start a build, and forks never get a run that could see the secrets.
on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if OpenSkiData hasn't published a new build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ski-bundles
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'hudsonschmidt/homebound-website'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: skidata/requirements.txt

      - name: Install
        run: pip install -r skidata/requirements.txt pytest==9.2.0

      - name: Test
        run: python -m pytest skidata/tests -q

      - name: Build and upload
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_SKI_ACCESS_KEY_ID: ${{ secrets.R2_SKI_ACCESS_KEY_ID }}
          R2_SKI_SECRET_ACCESS_KEY: ${{ secrets.R2_SKI_SECRET_ACCESS_KEY }}
          R2_SKI_BUCKET: ${{ secrets.R2_SKI_BUCKET }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          args=(--upload)
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python skidata/build_bundles.py "${args[@]}"
